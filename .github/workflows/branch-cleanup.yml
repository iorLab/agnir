name: One-shot branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/branch-cleanup.yml

permissions:
  contents: write

jobs:
  delete-non-main-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Delete every branch except main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(gh api --paginate "repos/${REPO}/branches?per_page=100" --jq '.[].name')
          for branch in "${branches[@]}"; do
            if [[ "$branch" == "main" ]]; then
              continue
            fi
            echo "Deleting branch: $branch"
            gh api --method DELETE "repos/${REPO}/git/refs/heads/${branch}"
          done
