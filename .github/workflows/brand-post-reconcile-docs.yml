name: Brand post-reconcile docs

on:
  push:
    branches:
      - brand/identity-system

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/identity-system
          fetch-depth: 0
      - name: Reapply brand-only repository map entries to latest main documents
        shell: python
        run: |
          from pathlib import Path

          readme_entries = {
              "README.md": "├── brand/                            # approved brand masters, exports, QA, references, and handoff\n",
              "README.zh-CN.md": "├── brand/                            # 已批准品牌主稿、导出、QA、参考与交付说明\n",
          }
          for name, line in readme_entries.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "├── brand/" not in text:
                  anchor = "├── .agnir/"
                  idx = text.find(anchor)
                  if idx < 0:
                      raise SystemExit(f"README tree anchor missing in {name}")
                  text = text[:idx] + line + text[idx:]
                  path.write_text(text, encoding="utf-8")

          tree_path = Path("REPOSITORY_TREE.md")
          text = tree_path.read_text(encoding="utf-8")
          if "├── brand/" not in text:
              block = '''├── brand/                                                # Agnir 品牌识别与 production asset surface
│   ├── README.md                                         # 品牌目录职责、production authority 与 integration status
│   ├── APPROVED-VISUAL-REFERENCE.md                      # Principal 批准的 10:42 AM 视觉基准与 source hash
│   ├── PRODUCTION-STATUS.md                              # 当前 master / derivative / QA / integration gates
│   ├── brand-handoff.md                                  # 下游使用规则与禁止替换项
│   ├── brand-process-log.md                              # 品牌设计与生产过程记录
│   ├── INTEGRATION-NOTE.md                               # 品牌分支与最新 main 的 reconcile 说明
│   ├── reference/                                       # extraction coordinates / source-reference manifests
│   ├── masters/                                         # 批准的 Agnir vector production masters
│   │   └── candidates/                                  # 历史 review candidates；不作为 production truth
│   ├── exports/                                         # light/dark/mono/app/favicon 等 materialized derivatives
│   ├── qa/                                              # 对称 13 项 final QA 范围与 evidence metadata
│   └── tools/                                           # deterministic derivative / raster / review tooling
│
'''
              anchor = "├── spec/"
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit("REPOSITORY_TREE brand insertion anchor missing")
              text = text[:idx] + block + text[idx:]
              tree_path.write_text(text, encoding="utf-8")
      - name: Commit reconciled brand documentation
        run: |
          if git diff --quiet -- README.md README.zh-CN.md REPOSITORY_TREE.md; then
            echo "Brand documentation already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md REPOSITORY_TREE.md
          git commit -m "docs: reapply brand map to reconciled main [skip ci]"
          git push origin HEAD:brand/identity-system
