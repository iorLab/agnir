name: Temporary website copy and top button

on:
  push:
    branches:
      - public/refine-copy-top-button
    paths:
      - ".github/workflows/tmp-copy-top-button.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: public/refine-copy-top-button

      - name: Apply approved website polish
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          style = '''\n  <style>\n    .back-to-top {\n      position: fixed;\n      right: 24px;\n      bottom: 24px;\n      z-index: 30;\n      width: 44px;\n      height: 44px;\n      display: grid;\n      place-items: center;\n      border: 1px solid rgba(239, 215, 195, 0.22);\n      border-radius: 50%;\n      background: rgba(24, 19, 15, 0.92);\n      color: #efd7c3;\n      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.28);\n      cursor: pointer;\n      opacity: 0;\n      transform: translateY(10px);\n      pointer-events: none;\n      transition: opacity 140ms ease, transform 140ms ease, border-color 140ms ease, background 140ms ease;\n    }\n    .back-to-top:hover { border-color: rgba(237, 190, 151, 0.55); background: rgba(30, 23, 17, 0.98); }\n    .back-to-top.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }\n    @media (max-width: 640px) { .back-to-top { right: 16px; bottom: 16px; width: 42px; height: 42px; } }\n    @media (prefers-reduced-motion: reduce) { .back-to-top { transition: none; } }\n  </style>'''

          script = '''\n  <script>\n    const backToTopButton = document.querySelector('[data-back-to-top]');\n    const syncBackToTop = () => backToTopButton.classList.toggle('visible', window.scrollY > 520);\n    backToTopButton.addEventListener('click', () => {\n      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;\n      window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });\n    });\n    window.addEventListener('scroll', syncBackToTop, { passive: true });\n    syncBackToTop();\n  </script>'''

          def add_back_to_top(path, label):
              page = Path(path)
              text = page.read_text(encoding='utf-8')
              if 'class="back-to-top"' not in text:
                  text = text.replace('</head>', style + '\n</head>', 1)
                  button = f'  <button class="back-to-top" type="button" data-back-to-top aria-label="{label}" title="{label}">↑</button>\n\n'
                  text = text.replace('  <script>\n    const copyIcon', button + '  <script>\n    const copyIcon', 1)
                  text = text.replace('</body>', script + '\n</body>', 1)
              page.write_text(text, encoding='utf-8')

          zh = Path('website/zh-CN.html')
          zh_text = zh.read_text(encoding='utf-8')
          zh_text = zh_text.replace('Agnir 就会帮你把当前项目状态保存下来。', 'Agnir 就会保存当前项目状态。', 1)
          zh_text = zh_text.replace('你不用为了 Agnir 放弃原来的工作方式。', '不用改原来的工作方式', 1)
          zh.write_text(zh_text, encoding='utf-8')

          add_back_to_top('website/zh-CN.html', '回到顶部')
          add_back_to_top('website/index.html', 'Back to top')

          Path('.github/workflows/tmp-copy-top-button.yml').unlink()
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "website: tighten Chinese copy and add back-to-top"
          git push origin HEAD:public/refine-copy-top-button
