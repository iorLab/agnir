name: Temporary Chinese install polish

on:
  push:
    branches:
      - public/trim-install-cta

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: public/trim-install-cta

      - name: Apply approved copy
        shell: bash
        run: |
          set -euo pipefail
          sed -i '/<div class="actions install-actions">/,/<\/div>/d' website/zh-CN.html
          sed -i 's/先装上。等你下次打开新会话，再说一句“继续”，区别会立刻出现。/先装上，打开新会话，说一句“继续”，区别会立刻出现。/' website/zh-CN.html
          rm .github/workflows/tmp-zh-install-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "website: trim Chinese install section"
          git push origin HEAD:public/trim-install-cta
