name: Brand tree sync

on:
  push:
    branches:
      - brand/identity-system

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/identity-system
          fetch-depth: 0
      - name: Add brand surface to compact README trees
        shell: python
        run: |
          from pathlib import Path

          line_en = "├── brand/                            # approved brand masters, exports, QA, references, and handoff\n"
          line_zh = "├── brand/                            # 已批准品牌主稿、导出、QA、参考与交付说明\n"
          for name, line in (("README.md", line_en), ("README.zh-CN.md", line_zh)):
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if line.strip() in text:
                  continue
              anchor = "├── .agnir/"
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit(f"compact repository tree anchor not found in {name}")
              text = text[:idx] + line + text[idx:]
              path.write_text(text, encoding="utf-8")
      - name: Commit synchronized README trees
        run: |
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "README trees already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md
          git commit -m "docs: add brand surface to repository trees [skip ci]"
          git push origin HEAD:brand/identity-system
