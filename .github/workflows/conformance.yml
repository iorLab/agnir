name: Agnir conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-hosting cold-start conformance
        run: python conformance/check_agnir_0_1.py
      - name: Negative discovery fixtures
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
