name: Agnir conformance

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  repository-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: RC Core 0.2 self-host cold-start
        if: github.ref == 'refs/heads/release/v0.2.0-rc.1' || github.head_ref == 'release/v0.2.0-rc.1'
        run: python conformance/check_agnir_0_2_rc.py
      - name: Published v0.1.1 real-repository migration root
        if: github.ref == 'refs/heads/release/validation-v0.2.0-rc.1-from-v0.1.1'
        run: |
          python - <<'PY'
          from pathlib import Path
          from activation_reference import resolve_agent_activation
          from repository_filesystem_0_2_reference import discover_repository_filesystem_0_2

          root = Path('.').resolve()
          activation = resolve_agent_activation(root)
          assert 'AGNIR.yaml' in activation.readme_section
          snapshot = discover_repository_filesystem_0_2(
              root,
              expected_project_identity='urn:agnir:project:agnir-core',
              expected_lineage_identity='urn:agnir:lineage:validation:v0.2.0-rc.1-from-v0.1.1',
          )
          assert 'Durable continuity belongs to the Project' in snapshot.state
          manifest = (root / 'AGNIR.yaml').read_text(encoding='utf-8')
          assert 'selector: "refs/heads/release/validation-v0.2.0-rc.1-from-v0.1.1"' in manifest
          assert 'applied_revision: "bee78b2c9bb8c5ce5916d08691019dcde939b813"' in manifest
          print('PASS: published v0.1.1 real-repository migration fresh-resumes as Core 0.2 RC')
          PY
      - name: Stable Core 0.1 compatibility regression
        run: |
          python -m unittest discover -s conformance -p 'test_checkpoint_semantics.py' -v
          python -m unittest discover -s conformance -p 'test_upgrade_semantics.py' -v
          python -m unittest discover -s conformance -p 'test_repository_filesystem_failures.py' -v
          python -m unittest discover -s conformance -p 'test_repository_filesystem_boundaries.py' -v
          python -m unittest discover -s conformance -p 'test_sqlite_backend.py' -v
      - name: Stable main self-hosting cold-start conformance
        if: github.ref == 'refs/heads/main' || github.base_ref == 'main' && !startsWith(github.head_ref, 'release/')
        run: python conformance/check_agnir_0_1.py
      - name: VCS branch continuity extension
        run: python -m unittest discover -s conformance -p 'test_vcs_branch_continuity.py' -v
      - name: Core 0.2 non-VCS parallel continuity
        run: python -m unittest discover -s conformance -p 'test_core_0_2_parallel_continuity.py' -v
      - name: Core 0.2 VCS mapping
        run: python -m unittest discover -s conformance -p 'test_core_0_2_vcs_mapping.py' -v
      - name: repository-filesystem 0.2 discovery
        run: python -m unittest discover -s conformance -p 'test_repository_filesystem_0_2.py' -v
      - name: VCS lineage binding
        run: python -m unittest discover -s conformance -p 'test_vcs_lineage_binding.py' -v
      - name: Core 0.1 to 0.2 migration semantics
        run: python -m unittest discover -s conformance -p 'test_core_0_2_migration.py' -v
      - name: repository-filesystem 0.1 to 0.2 migration
        run: python -m unittest discover -s conformance -p 'test_repository_filesystem_0_2_migration.py' -v
      - name: RC fresh install and published v0.1.1 migration
        if: startsWith(github.ref, 'refs/heads/release/') || startsWith(github.head_ref, 'release/')
        run: python -m unittest discover -s conformance -p 'test_rc_release_gates.py' -v
      - name: Full conformance suite
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
