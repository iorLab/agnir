name: Agnir conformance

on:
  push:
    branches:
      - main
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  repository-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install conformance dependencies
        run: python -m pip install --disable-pip-version-check -r conformance/requirements.txt
      - name: Core 0.2 repository self-host cold-start
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main' || startsWith(github.head_ref, 'release/')
        run: python conformance/check_agnir_0_2.py
      - name: Stable Core 0.1 compatibility regression
        run: |
          python -m unittest discover -s conformance -p 'test_checkpoint_semantics.py' -v
          python -m unittest discover -s conformance -p 'test_upgrade_semantics.py' -v
          python -m unittest discover -s conformance -p 'test_repository_filesystem_failures.py' -v
          python -m unittest discover -s conformance -p 'test_repository_filesystem_boundaries.py' -v
          python -m unittest discover -s conformance -p 'test_sqlite_backend.py' -v
      - name: VCS branch continuity extension
        run: python -m unittest discover -s conformance -p 'test_vcs_branch_continuity.py' -v
      - name: Core 0.2 non-VCS parallel continuity
        run: python -m unittest discover -s conformance -p 'test_core_0_2_parallel_continuity.py' -v
      - name: Core 0.2 VCS mapping
        run: python -m unittest discover -s conformance -p 'test_core_0_2_vcs_mapping.py' -v
      - name: repository-filesystem 0.2 discovery
        run: python -m unittest discover -s conformance -p 'test_repository_filesystem_0_2.py' -v
      - name: VCS lineage binding
        run: python -m unittest discover -s conformance -p 'test_vcs_lineage_binding.py' -v
      - name: Core 0.1 to 0.2 migration semantics
        run: python -m unittest discover -s conformance -p 'test_core_0_2_migration.py' -v
      - name: repository-filesystem 0.1 to 0.2 migration
        run: python -m unittest discover -s conformance -p 'test_repository_filesystem_0_2_migration.py' -v
      - name: Fresh Core 0.2 install and published v0.1.1 migration
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.base_ref == 'main' || startsWith(github.head_ref, 'release/')
        run: python -m unittest discover -s conformance -p 'test_rc_release_gates.py' -v
      - name: Stable v0.2.0 package gates
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release/v0.2.0' || github.base_ref == 'main' || github.head_ref == 'release/v0.2.0'
        run: python -m unittest discover -s conformance -p 'test_stable_release_gates.py' -v
      - name: Full conformance suite
        run: python -m unittest discover -s conformance -p 'test_*.py' -v

  publish-v0-2-0-rc-1:
    name: Publish v0.2.0-rc.1 prerelease
    needs: repository-filesystem
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/v0.2.0-rc.1' &&
      github.event.head_commit.message == 'rc: arm v0.2.0-rc.1 publication'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact RC publication candidate
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.2.0-rc.1"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
      - name: Create immutable RC tag and prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.0-rc.1"
          repo="${GITHUB_REPOSITORY}"
          if tag_json=$(gh api "repos/${repo}/git/ref/tags/${tag}" 2>/dev/null); then
            test "$(printf '%s' "${tag_json}" | jq -r '.object.sha')" = "${GITHUB_SHA}"
          else
            gh api --method POST "repos/${repo}/git/refs" -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          fi
          if release_json=$(gh api "repos/${repo}/releases/tags/${tag}" 2>/dev/null); then
            test "$(printf '%s' "${release_json}" | jq -r '.tag_name')" = "${tag}"
          else
            gh api --method POST "repos/${repo}/releases" -f tag_name="${tag}" -f target_commitish="${GITHUB_SHA}" -f name="Agnir ${tag}" -f body="Agnir ${tag} prerelease." -F draft=false -F prerelease=true >/dev/null
          fi
          test "$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.sha')" = "${GITHUB_SHA}"
          test "$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.prerelease')" = "true"
          test "$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.draft')" = "false"

  publish-v0-2-0:
    name: Publish v0.2.0 stable release
    needs: repository-filesystem
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/release/v0.2.0' &&
      github.event.head_commit.message == 'release: publish v0.2.0 stable'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact stable publication candidate
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "0.2.0"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          grep -q '# Agnir Core 0.2 — Normative Specification' spec/AGNIR_CORE_0_2.md
          grep -q 'Stable normative profile' profiles/REPOSITORY_FILESYSTEM_0_2.md
      - name: Create immutable stable tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.2.0"
          repo="${GITHUB_REPOSITORY}"

          if tag_json=$(gh api "repos/${repo}/git/ref/tags/${tag}" 2>/dev/null); then
            existing_sha=$(printf '%s' "${tag_json}" | jq -r '.object.sha')
            test "${existing_sha}" = "${GITHUB_SHA}"
          else
            gh api --method POST "repos/${repo}/git/refs" \
              -f ref="refs/tags/${tag}" \
              -f sha="${GITHUB_SHA}" >/dev/null
          fi

          body=$(cat <<EOF
          Agnir v0.2.0 stable release.

          Exact candidate: ${GITHUB_SHA}
          Conformance workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          Core: 0.2
          Profile: repository-filesystem/0.2
          Accepted RC: v0.2.0-rc.1 at 50a8cd565954e7e8055b8b628e2d620ac7357bab

          Highlights: stable Continuity Lineages, selector/identity separation, lineage-local checkpoints, staged target reconciliation, non-VCS + VCS conformance, explicit v0.1.1/Core 0.1 migration, fresh install/resume evidence, and safe authoritative-main acceptance.
          EOF
          )

          if release_json=$(gh api "repos/${repo}/releases/tags/${tag}" 2>/dev/null); then
            test "$(printf '%s' "${release_json}" | jq -r '.tag_name')" = "${tag}"
            test "$(printf '%s' "${release_json}" | jq -r '.prerelease')" = "false"
            test "$(printf '%s' "${release_json}" | jq -r '.draft')" = "false"
          else
            gh api --method POST "repos/${repo}/releases" \
              -f tag_name="${tag}" \
              -f target_commitish="${GITHUB_SHA}" \
              -f name="Agnir ${tag}" \
              -f body="${body}" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          tag_sha=$(gh api "repos/${repo}/git/ref/tags/${tag}" --jq '.object.sha')
          prerelease=$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.prerelease')
          draft=$(gh api "repos/${repo}/releases/tags/${tag}" --jq '.draft')
          latest=$(gh api "repos/${repo}/releases/latest" --jq '.tag_name')
          test "${tag_sha}" = "${GITHUB_SHA}"
          test "${prerelease}" = "false"
          test "${draft}" = "false"
          test "${latest}" = "${tag}"
          echo "PASS: ${tag} -> ${tag_sha}; prerelease=${prerelease}; draft=${draft}; latest=${latest}"
