name: Agnir conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  repository-filesystem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python conformance/check_agnir_0_1.py
