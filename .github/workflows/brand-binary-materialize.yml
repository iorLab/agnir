name: Brand binary materialization

on:
  push:
    branches:
      - brand/identity-system

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/identity-system
          fetch-depth: 0
      - name: Verify uploaded handoff archive
        run: |
          echo "52e8cee3c03f0762fc47d579505122dc452e5de97dafb462a3b470ed5457f72d  svif-agnir-brand-binary-integration-handoff.zip" | sha256sum -c -
      - name: Materialize Agnir binaries with SHA verification
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import json
          import shutil
          import zipfile

          root = Path.cwd()
          archive = root / "svif-agnir-brand-binary-integration-handoff.zip"
          work = root / ".brand-handoff"
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()
          with zipfile.ZipFile(archive) as z:
              z.extractall(work)

          manifest = json.loads((work / "manifest.json").read_text(encoding="utf-8"))

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          selected = []
          for source_rel, spec in manifest["targets"].items():
              if spec["repository"] == "agnir":
                  selected.append((source_rel, spec["target"], spec["sha256"]))

          if len(selected) != 15:
              raise SystemExit(f"expected 15 Agnir targets, got {len(selected)}")

          for source_rel, target_rel, expected in selected:
              src = work / source_rel
              if not src.is_file():
                  raise SystemExit(f"missing payload: {source_rel}")
              got = sha256(src)
              if got != expected:
                  raise SystemExit(f"source SHA mismatch: {source_rel}: {got} != {expected}")
              dst = root / target_rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(src, dst)
              got = sha256(dst)
              if got != expected:
                  raise SystemExit(f"destination SHA mismatch: {target_rel}: {got} != {expected}")
              print(f"PASS {target_rel} {expected}")

          shutil.rmtree(work)
          print("PASS: 15 Agnir byte-exact brand targets materialized")
      - name: Reapply brand repository-map entries to latest-main documents
        shell: python
        run: |
          from pathlib import Path

          readme_entries = {
              "README.md": "├── brand/                            # approved brand masters, exports, QA, references, and handoff\n",
              "README.zh-CN.md": "├── brand/                            # 已批准品牌主稿、导出、QA、参考与交付说明\n",
          }
          for name, line in readme_entries.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              if "├── brand/" not in text:
                  anchor = "├── .agnir/"
                  idx = text.find(anchor)
                  if idx < 0:
                      raise SystemExit(f"README tree anchor missing in {name}")
                  path.write_text(text[:idx] + line + text[idx:], encoding="utf-8")

          tree_path = Path("REPOSITORY_TREE.md")
          text = tree_path.read_text(encoding="utf-8")
          if "├── brand/" not in text:
              block_lines = [
                  "├── brand/                                                # Agnir 品牌识别与 production asset surface",
                  "│   ├── README.md                                         # 品牌目录职责、production authority 与 integration status",
                  "│   ├── APPROVED-VISUAL-REFERENCE.md                      # Principal 批准的 10:42 AM 视觉基准与 source hash",
                  "│   ├── PRODUCTION-STATUS.md                              # 当前 master / derivative / QA / integration gates",
                  "│   ├── brand-handoff.md                                  # 下游使用规则与禁止替换项",
                  "│   ├── brand-process-log.md                              # 品牌设计与生产过程记录",
                  "│   ├── INTEGRATION-NOTE.md                               # 品牌分支与最新 main 的 reconcile 说明",
                  "│   ├── reference/                                       # byte-exact approved references / extraction manifests",
                  "│   ├── masters/                                         # 批准的 Agnir vector production masters",
                  "│   │   └── candidates/                                  # 历史 review candidates；不作为 production truth",
                  "│   ├── exports/                                         # SVG treatments and byte-exact PNG delivery derivatives",
                  "│   ├── qa/                                              # 对称 13 项 final QA 范围与 evidence metadata",
                  "│   └── tools/                                           # deterministic derivative / raster / review tooling",
                  "│",
              ]
              block = "\n".join(block_lines) + "\n"
              anchor = "├── spec/"
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit("REPOSITORY_TREE brand insertion anchor missing")
              tree_path.write_text(text[:idx] + block + text[idx:], encoding="utf-8")
      - name: Commit materialized assets and remove transport files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brand README.md README.zh-CN.md REPOSITORY_TREE.md
          git rm svif-agnir-brand-binary-integration-handoff.zip
          git rm .github/workflows/brand-binary-materialize.yml
          git commit -m "brand: materialize byte-exact production binaries [skip ci]"
          git push origin HEAD:brand/identity-system
