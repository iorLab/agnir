name: Reconcile Agnir v0.1.1 publication

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-release-v0.1.1.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified post-release payload
        run: |
          set -euo pipefail
          git fetch origin tmp-v0.1.1-post-release
          git checkout origin/tmp-v0.1.1-post-release -- \
            README.md \
            README.zh-CN.md \
            RELEASE.md \
            AGNIR.yaml \
            .agnir/state.md \
            .agnir/next-actions.md \
            .agnir/decisions.md \
            .agnir/evidence/2026-09-01-v0.1.1-publication.md
          rm -f .github/workflows/publish-v0.1.1.yml
          rm -f .github/workflows/post-release-v0.1.1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "checkpoint: record Agnir v0.1.1 publication"
          git push origin HEAD:main

      - name: Remove temporary payload branch
        run: |
          set -euo pipefail
          git push origin --delete tmp-v0.1.1-post-release
