          Path("AGNIR.yaml").write_text(manifest.replace(old_manifest, new_manifest), encoding="utf-8")

          Path(".agnir/evidence/2026-09-01-v0.1.1-publication.md").write_text(f"""# Agnir v0.1.1 publication — 2026-09-01

