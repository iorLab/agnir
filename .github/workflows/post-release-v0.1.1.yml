## Stable maintenance constraints

- Root `SKILL.md` is the canonical Agent-facing operational package.
- Required execution-surface settings are adapters/locators, not Project memory or Agnir Core.
- `.agnir/evidence/` is represented by directory responsibility rather than per-evidence filename registration in repository maps.
- `main` is the only intended long-lived authoritative branch.
""", encoding="utf-8")

          replace_exact(
              ".agnir/decisions.md",
              "- Core compatibility is `0.1`; repository/filesystem compatibility is `repository-filesystem/0.1`; published repository SemVer is `0.1.0` until `v0.1.1` is actually created.\n- The execution-surface activation handoff repair is a non-breaking operational patch and is planned for repository release `0.1.1`; it does not justify changing Core/profile compatibility identifiers.\n- `RELEASE.md` is the publication contract. A material release-preparation change must pass the full conformance workflow on its exact revision before that revision is considered the publication candidate.",
              f"- Core compatibility is `0.1`; repository/filesystem compatibility is `repository-filesystem/0.1`; published repository SemVer is now `0.1.1`.\n- The execution-surface activation handoff repair shipped in repository release `v0.1.1` as a non-breaking operational patch; it does not change Core/profile compatibility identifiers.\n- `RELEASE.md` is the publication contract. Repository release `v0.1.1` is immutably anchored to exact verified revision `{target}`; later `main` maintenance cannot redefine that release target.\n- `latest stable release` now resolves to published `v0.1.1` until a newer stable tag/release is actually published.",
          )

          manifest = Path("AGNIR.yaml").read_text(encoding="utf-8")
          old_manifest = """extensions:\n  agnir/repository:\n    canonical: \"iorLab/agnir\"\n    authoritative_ref: \"main\"\n"""
          new_manifest = f"""extensions:\n  agnir/repository:\n    canonical: \"iorLab/agnir\"\n    authoritative_ref: \"main\"\n  agnir/operations:\n    distribution: \"agnir-agent-skill\"\n    release: \"0.1.1\"\n    source: \"iorLab/agnir\"\n    applied_revision: \"{target}\"\n"""
          if old_manifest not in manifest:
