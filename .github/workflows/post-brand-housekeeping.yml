name: Agnir post-brand housekeeping

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire-brand-ref:
    runs-on: ubuntu-latest
    steps:
      - name: Retire integrated brand ref when exactly armed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          arm_message="housekeeping: retire integrated brand branch"
          if [ "${HEAD_MESSAGE}" != "${arm_message}" ]; then
            echo "SKIP: brand-ref retirement not armed for this commit"
            exit 0
          fi

          repo="${GITHUB_REPOSITORY}"

          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0" --jq '.object.sha')" = "6d16dcfd17b8e9f22fd25804e22b9f8a516d06c3"
          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0-rc.1" --jq '.object.sha')" = "092945289f1a0a9803e4fe0583104aa380ceaadc"
          test "$(gh api "repos/${repo}/pulls/11" --jq '.merged_at != null')" = "true"

          if gh api "repos/${repo}/git/ref/heads/brand/identity-system" >/dev/null 2>&1; then
            gh api --method DELETE "repos/${repo}/git/refs/heads/brand/identity-system"
          fi
          if gh api "repos/${repo}/git/ref/heads/brand/identity-system" >/dev/null 2>&1; then
            echo "FAIL: brand/identity-system still exists" >&2
            exit 1
          fi

          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0" --jq '.object.sha')" = "6d16dcfd17b8e9f22fd25804e22b9f8a516d06c3"
          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0-rc.1" --jq '.object.sha')" = "092945289f1a0a9803e4fe0583104aa380ceaadc"
          echo "PASS: integrated brand branch retired; release anchors preserved"
