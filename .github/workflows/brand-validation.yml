name: Brand integration validation

on:
  push:
    branches:
      - brand/identity-system

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: brand/identity-system
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Agnir conformance
        run: python conformance/check_agnir_0_1.py
      - name: Agnir unit conformance
        run: python -m unittest discover -s conformance -p 'test_*.py' -v
