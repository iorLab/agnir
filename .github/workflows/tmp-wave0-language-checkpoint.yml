name: Temporary Wave 0 language checkpoint

on:
  push:
    branches:
      - checkpoint/wave0-browser-language-default
    paths:
      - ".github/workflows/tmp-wave0-language-checkpoint.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: checkpoint/wave0-browser-language-default

      - name: Reconcile Agnir continuity
        shell: python
        run: |
          from pathlib import Path

          state_path = Path('.agnir/state.md')
          next_path = Path('.agnir/next-actions.md')
          decisions_path = Path('.agnir/decisions.md')

          state = state_path.read_text(encoding='utf-8')
          next_actions = next_path.read_text(encoding='utf-8')
          decisions = decisions_path.read_text(encoding='utf-8')

          state = state.replace(
              '- topics: still empty;',
              '- topics: set to `developer-tools`, `durable-continuity`, `project-continuity`, `protocol`, and `state-management`;'
          )
          state = state.replace(
              'The only material unfinished Wave 0 repository-host item is topic metadata. Repository licensing and contribution presentation are closed under the Principal-approved Apache-2.0 decision.',
              'Repository-host Wave 0 hygiene is now closed: topics are set, Apache-2.0 and contribution guidance are live, Pages/homepage/feedback are live, completed non-authoritative branches were retired, and GitHub is configured to delete merged head branches automatically.'
          )
          state = state.replace(
              '- Simplified Chinese README uses the same theme-aware transparent lockup system and localized visible prose;\n',
              '- Simplified Chinese README uses the same theme-aware transparent lockup system and localized visible prose;\n- the bilingual website uses browser language only as a first-visit default at the root URL (`zh-*` -> `zh-CN.html`, otherwise English), while explicit `English` / `中文` choices persist in same-origin `localStorage` and take precedence; direct `zh-CN.html` visits are respected; both pages publish `hreflang` alternates;\n'
          )
          state = state.replace(
              'Agnir remains in stable maintenance + downstream adoption mode. Pages, automatic deployment, transparent website/README branding, Apache-2.0 licensing, contribution guidance, and external feedback intake are closed. Immediate public-adoption work is the remaining topic metadata, followed by the canonical fresh-session demo and external design-user evidence.',
              'Agnir remains in stable maintenance + downstream adoption mode. Wave 0 repository-host hygiene, Pages, automatic deployment, transparent website/README branding, Apache-2.0 licensing, contribution guidance, external feedback intake, and default bilingual routing are closed. Immediate public-adoption work is the canonical fresh-session demo followed by external design-user evidence.'
          )

          list_start = next_actions.index('1. **Operate in stable-maintenance mode.**')
          list_end = next_actions.index('\n## GitHub Pages accepted state')
          new_list = '''1. **Operate in stable-maintenance mode.** Preserve Core/profile 1.0 semantics and historical 0.1/0.2 compatibility/migration surfaces. Patch releases must not silently redefine the stable public contract.\n2. **Produce the canonical 30-second fresh-session demo.** Demonstrate the visible contrast between an unassisted fresh session and a fresh Executor resuming Project-owned Agnir continuity. Lead with value, not protocol vocabulary.\n3. **Recruit the first external design users.** Target Projects not controlled by Agnir maintainers; verify public understanding, one-line installation, second-session value, and retention without hidden founding-context coaching.\n4. **Collect material post-1.0 adoption evidence.** Svif is the first accepted real-project 0.2→1.0 promotion case. Use the public adoption-report issue form as an intake surface, then review material reports before accepting them as evidence. Prioritize genuine external cold-start resumes, cross-Executor cases, new execution surfaces, repeat use, and independently built integrations.\n5. **Keep brand production truth locked.** README, website, adoption/demo and social materials may consume approved brand assets or deterministic derivatives from approved masters, but must not aesthetically reinterpret the Agnir identity. Material visual changes require new Principal approval.\n6. **Run technical launch only after external proof exists.** Use the fresh-session value story first; use independent implementation, lineage/reconciliation, mount/storage relocation, and conformance as credibility layers after the user value is understood.\n7. **Keep merged-head cleanup enabled.** `main` is the sole long-lived branch and GitHub `delete_branch_on_merge=true` is accepted housekeeping; do not retain completed staging branches unless a new explicit evidence need requires one.\n8. **Shift active product execution back to Svif where appropriate.** Svif's own canonical continuity governs its ChatGPT/Plugins publication path; do not smuggle Svif changes into Agnir maintenance.\n9. **Keep FishUp production publication separate.** No FishUp main advancement without separate authorization.\n'''
          next_actions = next_actions[:list_start] + new_list + next_actions[list_end:]
          next_actions = next_actions.replace('Topics — **still pending**:', 'Topics — **set**:')

          website_anchor = '- A custom domain is not implied or authorized by the existence of website source; custom-domain selection is a separate repository-host/brand decision.\n'
          language_decision = '''- The root public website may use the browser's first preferred UI language only as a **default** when no explicit visitor preference is stored: `zh-*` selects `zh-CN.html`; other languages remain on English.\n- Manual `English` / `中文` selection is an explicit visitor preference and may be persisted in same-origin `localStorage`; it takes precedence over later automatic root-page language detection. A direct `zh-CN.html` URL must be respected and not auto-redirected away.\n- Browser-language routing and `hreflang` publication are presentation/SEO behavior only; they do not redefine Project Continuity, Core/profile semantics, or durable Project truth.\n'''
          if language_decision not in decisions:
              decisions = decisions.replace(website_anchor, website_anchor + language_decision)

          decisions = decisions.replace(
              '- The three retained evidence-only refs are currently `release/v1.0.0-rc.1`, `release/v1.0.0`, and `validation/mount-boundary-v0.2.0`.',
              '- As of 2026-09-07, completed non-authoritative release/validation/checkpoint/public branches were retired and repository branch readback contains only `main`. Immutable release tags plus accepted `.agnir/evidence/` receipts remain the durable release/evidence anchors.\n- GitHub `delete_branch_on_merge=true` is enabled so ordinary merged head branches are retired automatically. A future branch may still be retained only when an explicit unresolved evidence need justifies it.'
          )

          assert 'topics: set to `developer-tools`' in state
          assert 'browser language only as a first-visit default' in state
          assert '2. **Produce the canonical 30-second fresh-session demo.**' in next_actions
          assert 'Topics — **set**:' in next_actions
          assert 'delete_branch_on_merge=true' in next_actions
          assert "browser's first preferred UI language" in decisions
          assert 'repository branch readback contains only `main`' in decisions

          state_path.write_text(state, encoding='utf-8')
          next_path.write_text(next_actions, encoding='utf-8')
          decisions_path.write_text(decisions, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-wave0-language-checkpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agnir/state.md .agnir/next-actions.md .agnir/decisions.md .github/workflows/tmp-wave0-language-checkpoint.yml
          git commit -m "checkpoint: close Wave 0 and accept language default"
          git push origin HEAD:checkpoint/wave0-browser-language-default
