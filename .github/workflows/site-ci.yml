name: Site CI

on:
  pull_request:
    paths:
      - 'site/**'
      - 'VERSION'
      - 'spec/**'
      - 'profiles/**'
      - 'implementations/**'
      - 'backends/**'
      - 'adapters/**'
      - 'templates/**'
      - '.github/workflows/site-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'VERSION'
      - 'spec/**'
      - 'profiles/**'
      - 'implementations/**'
      - 'backends/**'
      - 'adapters/**'
      - 'templates/**'
      - '.github/workflows/site-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build and validate Worker package
        run: npm run check:deploy
