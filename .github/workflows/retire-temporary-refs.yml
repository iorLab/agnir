name: Agnir temporary-ref retirement

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  retire-temporary-refs:
    runs-on: ubuntu-latest
    steps:
      - name: Retire safe temporary refs when exactly armed
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          arm_message="housekeeping: retire safe temporary refs"
          if [ "${HEAD_MESSAGE}" != "${arm_message}" ]; then
            echo "SKIP: retirement not armed for this commit"
            exit 0
          fi

          repo="${GITHUB_REPOSITORY}"

          # Immutable release anchors must remain exact.
          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0" --jq '.object.sha')" = "6d16dcfd17b8e9f22fd25804e22b9f8a516d06c3"
          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0-rc.1" --jq '.object.sha')" = "092945289f1a0a9803e4fe0583104aa380ceaadc"

          # These branch refs are deliberately retained in this pass.
          for branch in \
            "brand/identity-system" \
            "release/v1.0.0-rc.1" \
            "release/v1.0.0" \
            "validation/mount-boundary-v0.2.0"; do
            gh api "repos/${repo}/git/ref/heads/${branch}" >/dev/null
          done

          retired=(
            "feature/core-0.2-lineage"
            "feature/multibranch-continuity"
            "integration/core-0.2-main-candidate"
            "integration/v0.2.0-rc.1-main-reconcile"
            "integration/v0.2.0-stable-main-reconcile"
            "integration/v1.0.0-stable"
            "promotion/core-profile-1.0"
            "release/v0.2.0-rc.1"
            "release/v0.2.0"
            "release/v1.0.0-target-validation"
            "release/validation-v0.2.0-rc.1-from-v0.1.1"
            "repair/evidence-locator-shape"
            "repair/independent-docs-v1"
            "repair/migration-lineage-normalization"
            "repair/reference-schema-conformance"
            "repair/version-type-conformance"
            "validation/v0.2.0-rc.1-from-v0.1.1"
          )

          for branch in "${retired[@]}"; do
            if gh api "repos/${repo}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "retiring ${branch}"
              gh api --method DELETE "repos/${repo}/git/refs/heads/${branch}"
            else
              echo "already absent ${branch}"
            fi
          done

          for branch in "${retired[@]}"; do
            if gh api "repos/${repo}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              echo "FAIL: branch still exists: ${branch}" >&2
              exit 1
            fi
          done

          for branch in \
            "main" \
            "brand/identity-system" \
            "release/v1.0.0-rc.1" \
            "release/v1.0.0" \
            "validation/mount-boundary-v0.2.0"; do
            gh api "repos/${repo}/git/ref/heads/${branch}" >/dev/null
          done

          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0" --jq '.object.sha')" = "6d16dcfd17b8e9f22fd25804e22b9f8a516d06c3"
          test "$(gh api "repos/${repo}/git/ref/tags/v1.0.0-rc.1" --jq '.object.sha')" = "092945289f1a0a9803e4fe0583104aa380ceaadc"
          echo "PASS: safe temporary refs retired; retained anchors and immutable release tags preserved"
