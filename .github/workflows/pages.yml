name: Deploy Agnir website

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agnir-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp website/index.html _site/index.html
          cp website/zh-CN.html _site/zh-CN.html
          cp website/styles.css _site/styles.css
          cp brand/exports/agnir-horizontal-dark.svg _site/assets/agnir-horizontal-dark.svg
          cp brand/exports/agnir-favicon.svg _site/assets/agnir-favicon.svg
          cp brand/exports/png/agnir-social-card.png _site/assets/agnir-social-card.png
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
