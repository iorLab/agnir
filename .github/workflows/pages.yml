name: Deploy Agnir website

on:
  push:
    branches:
      - main
    paths:
      - "website/**"
      - "brand/masters/agnir-mark.svg"
      - "brand/masters/agnir-wordmark.svg"
      - "brand/tools/build-production-derivatives.py"
      - "brand/exports/png/agnir-social-card.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: agnir-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build static site artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/assets
          cp website/index.html _site/index.html
          cp website/zh-CN.html _site/zh-CN.html
          cp website/ja.html _site/ja.html
          cp website/ko.html _site/ko.html
          cp website/styles.css _site/styles.css
          cp website/theme.css _site/theme.css
          cp website/theme.js _site/theme.js
          python brand/tools/build-production-derivatives.py --repo . --out _site/assets
          cp brand/exports/png/agnir-social-card.png _site/assets/agnir-social-card.png
          rm -f _site/assets/agnir-favicon-32-source.svg _site/assets/agnir-favicon-16-source.svg
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
