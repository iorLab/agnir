agnir:
  version: "0.1"
  discovery_profile: "repository-filesystem/0.1"

project:
  identity: "urn:agnir:project:agnir-core"
  profiles:
    - generic

memory:
  state: ".agnir/state.md"
  next_actions: ".agnir/next-actions.md"
  decisions: ".agnir/decisions.md"
  evidence: ".agnir/evidence/"

policy:
  checkpoint: event-driven

extensions:
  agnir/repository:
    canonical: "iorLab/agnir"
    authoritative_ref: "main"
  agnir/vcs:
    branch_continuity: "branch-local"
    integration_reconciliation: "required"
  agnir/experiments:
    core_0_2_parallel_continuity: "real-consumer-validated"
    core_0_2_spec: "spec/AGNIR_CORE_0_2_DRAFT.md"
    core_0_2_release_phase: "pre-rc"
  agnir/operations:
    distribution: "agnir-agent-skill"
    release: "0.1.1"
    source: "iorLab/agnir"
    applied_revision: "e9712357ab590e5c1e5357b3cf3219d07d789aff"
